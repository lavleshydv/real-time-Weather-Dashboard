<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO LIST APPLICATION</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="glow-bg"></div>
    <div class="app-container">
        <header>
            <div class="logo">
                <i class="fas fa-terminal"></i>
                <h1>SET YOUR TASKS <span>// v1.0</span></h1>
            </div>
            <p class="subtitle">System status: <span class="status-online">Online</span></p>
        </header>

        <form id="todo-form">
            <div class="input-wrapper">
                <span class="prompt-symbol">~ $</span>
                <input type="text" id="todo-input" placeholder="Enter new task directive..." autocomplete="off"
                    required>
                <button type="submit" id="add-btn"><i class="fas fa-level-down-alt fa-rotate-90"></i></button>
            </div>
        </form>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">[ All ]</button>
            <button class="filter-btn" data-filter="active">[ Active ]</button>
            <button class="filter-btn" data-filter="completed">[ Completed ]</button>
        </div>

        <div class="list-container">
            <ul id="todo-list">
                <!-- To-Do items will be generated here -->
            </ul>
        </div>

        <div class="todo-footer">
            <span id="items-left">0 processes running</span>
            <button id="clear-completed"><i class="fas fa-trash"></i> Kill Completed</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
